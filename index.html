<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Location</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#fff;
}


/* =========================
   TOP LOCATION
========================= */

.locationTop{
    width:100%;
    padding:18px 16px 12px;
    background:#fff;
}

.locationTitle{
    display:flex;
    align-items:center;
    gap:6px;

    font-size:18px;
    font-weight:700;
    color:#181818;
}

.locationArrow{
    width:7px;
    height:7px;

    border-right:2px solid #333;
    border-bottom:2px solid #333;

    transform:rotate(45deg);
    margin-top:-4px;
}

.locationAddress{
    margin-top:4px;
    max-width:90%;

    font-size:12px;
    font-weight:400;
    color:#666;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   VIDEO AREA
========================= */

.videoArea{
    width:100%;
    margin-top:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent !important;
}


/* =========================
   VIDEO WRAPPER
========================= */

.videoWrap{
    width:65%;
    max-width:420px;

    position:relative;

    background:transparent !important;
    overflow:visible;
}


/* =========================
   SAFARI TRANSPARENT VIDEO
========================= */

.locationVideo{
    width:100%;
    height:auto;

    display:block;

    object-fit:contain;

    border:0 !important;
    outline:0 !important;
    box-shadow:none !important;

    background:transparent !important;
    background-color:transparent !important;

    -webkit-appearance:none !important;
    appearance:none !important;

    -webkit-box-shadow:none !important;

    opacity:0;
}


/* Show only after video has actual frame */
.locationVideo.videoReady{
    opacity:1;
}


/* SAFARI VIDEO CONTROLS */

.locationVideo::-webkit-media-controls{
    display:none !important;
}

.locationVideo::-webkit-media-controls-panel{
    display:none !important;
}

.locationVideo::-webkit-media-controls-start-playback-button{
    display:none !important;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .videoWrap{
        width:65%;
        max-width:360px;
    }

}
</style>
</head>

<body>


<!-- =========================
     TOP LOCATION
========================= -->

<div class="locationTop">

    <div class="locationTitle">

        <span>Current Location</span>

        <span class="locationArrow"></span>

    </div>

    <div class="locationAddress">
        hyderbad, Andhra Pradesh
    </div>

</div>



<!-- =========================
     VIDEO
========================= -->

<div class="videoArea">

    <div class="videoWrap">

        <video
            id="locationVideo"
            class="locationVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            disablepictureinpicture
        >
            <source
                src="ballons.webm"
                type="video/webm"
            >
        </video>

    </div>

</div>


<script>

const video = document.getElementById("locationVideo");

/* Safari autoplay */
video.muted = true;
video.defaultMuted = true;


/* Don't show Safari's black empty video surface.
   Show video only when a real frame is ready. */

function showVideo(){
    video.classList.add("videoReady");

    const playPromise = video.play();

    if(playPromise){
        playPromise.catch(function(){});
    }
}


video.addEventListener("loadeddata", showVideo);

video.addEventListener("canplay", showVideo);


/* Already cached video */

if(video.readyState >= 2){
    showVideo();
}

</script>


</body>
</html>
