<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Login</title>

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#07913d;
    overflow:hidden;
}

button,
input{
    font-family:'Poppins',sans-serif;
}

/* =========================
   FULL PAGE
========================= */

.login-page{
    width:100%;
    height:100dvh;
    position:relative;
    overflow:hidden;
    background:#07913d;
}


/* =========================
   GREEN HERO
========================= */

.login-hero{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        calc(35px + env(safe-area-inset-top))
        20px
        0;

    overflow:hidden;
}


/* LIGHT BACKGROUND LINES */

.login-hero::before{
    content:"";

    position:absolute;
    inset:-100px;

    background-image:

        linear-gradient(
            45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        ),

        linear-gradient(
            -45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        );

    background-size:85px 85px;

    pointer-events:none;
}


/* =========================
   BACK
========================= */

.back-btn{
    position:absolute;

    top:calc(35px + env(safe-area-inset-top));
    left:22px;

    z-index:20;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    background:transparent;

    color:rgba(255,255,255,.85);

    font-size:27px;

    cursor:pointer;
}


/* =========================
   CEZOO
========================= */

.cezoo-logo{
    position:relative;
    z-index:2;

    margin-top:55px;

    font-family:'Bungee',sans-serif;

    font-size:50px;
    line-height:1;

    letter-spacing:1px;

    color:#fff;

    text-shadow:
        0 4px 0 rgba(0,0,0,.13);
}


/* =========================
   TEXT
========================= */

.hero-text{
    position:relative;
    z-index:2;

    margin-top:27px;

    text-align:center;

    color:#fff;

    font-size:21px;
    line-height:1.35;

    font-weight:700;
}

.hero-text span{
    color:#ffe82e;
}


/* =========================
   IMAGE
========================= */

.login-character{
    position:relative;
    z-index:2;

    margin-top:5px;

    flex:1;

    width:min(78vw,390px);

    display:flex;
    justify-content:center;
    align-items:flex-end;

    transition:
        opacity .25s ease,
        transform .35s ease;
}

.login-character img{
    display:block;

    width:100%;
    max-height:430px;

    object-fit:contain;
    object-position:center bottom;
}


/* FORM OPEN AYYAKA IMAGE
   LITTLE UP + HIDE */

.login-page.sheet-open .login-character{
    opacity:0;
    transform:translateY(-30px);
    pointer-events:none;
}


/* =========================
   BOTTOM SHEET
========================= */

.login-sheet{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:30;

    background:#fff;

    border-radius:30px 30px 0 0;

    padding:
        28px
        24px
        calc(28px + env(safe-area-inset-bottom));

    box-shadow:
        0 -6px 25px rgba(0,0,0,.08);

    transition:
        min-height .38s cubic-bezier(.22,.8,.25,1),
        padding .38s ease;

    min-height:190px;
}


/* LOGIN START AYYAKA
   SAME WHITE SHEET PAIKI */

.login-page.sheet-open .login-sheet{
    min-height:58vh;

    padding-top:34px;
}


/* =========================
   INTRO CONTENT
========================= */

.sheet-intro{
    display:block;
}

.login-page.sheet-open .sheet-intro{
    display:none;
}


/* =========================
   MAIN LOGIN BUTTON
========================= */

.phone-login-btn{
    width:100%;
    height:60px;

    border:0;

    border-radius:30px;

    background:#078d39;

    color:#fff;

    font-size:17px;
    font-weight:600;

    cursor:pointer;
}

.phone-login-btn:active{
    transform:scale(.985);
}


/* =========================
   DASH LINE
========================= */

.terms-line{
    width:100%;

    margin:25px 0 18px;

    border-top:
        1px dashed
        rgba(100,100,100,.28);
}


/* =========================
   TERMS
========================= */

.terms{
    text-align:center;

    color:#999;

    font-size:11.5px;
    line-height:1.65;
}

.terms a{
    color:#777;

    font-weight:600;

    text-decoration:underline;
}


/* =========================
   FORM
========================= */

.sheet-form{
    display:none;
}

.login-page.sheet-open .sheet-form{
    display:block;
}


/* =========================
   STEP
========================= */

.login-step{
    display:none;
}

.login-step.active{
    display:block;

    animation:
        stepShow .25s ease;
}

@keyframes stepShow{

    from{
        opacity:0;
        transform:translateX(12px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}


/* =========================
   SMALL CEZOO INSIDE SHEET
========================= */

.sheet-brand{
    font-family:'Bungee',sans-serif;

    color:#078d39;

    font-size:19px;

    margin-bottom:22px;
}


/* =========================
   TITLE
========================= */

.step-title{
    color:#171717;

    font-size:23px;
    line-height:1.3;

    font-weight:700;
}

.step-subtitle{
    margin-top:7px;

    color:#858585;

    font-size:13px;
    line-height:1.5;
}


/* =========================
   INPUT
========================= */

.input-box{
    width:100%;
    height:59px;

    margin-top:23px;

    border:1.5px solid #e3e3e3;

    border-radius:15px;

    background:#fff;

    display:flex;
    align-items:center;

    overflow:hidden;

    transition:.2s ease;
}

.input-box:focus-within{
    border-color:#078d39;

    box-shadow:
        0 0 0 3px rgba(7,141,57,.07);
}

.input-box input{
    width:100%;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    padding:0 17px;

    font-size:16px;

    color:#171717;
}

.input-box input::placeholder{
    color:#aaa;
}


/* =========================
   MOBILE
========================= */

.mobile-prefix{
    padding:0 14px 0 17px;

    border-right:1px solid #ddd;

    font-size:15px;
    font-weight:600;

    color:#222;

    flex-shrink:0;
}

.mobile-box input{
    padding-left:13px;
}


/* =========================
   NEXT
========================= */

.next-btn{
    width:100%;
    height:57px;

    margin-top:15px;

    border:0;

    border-radius:15px;

    background:#078d39;

    color:#fff;

    font-size:16px;
    font-weight:600;

    cursor:pointer;
}

.next-btn:active{
    transform:scale(.985);
}


/* =========================
   OTP
========================= */

.otp-boxes{
    width:100%;

    display:flex;

    gap:8px;

    margin-top:23px;
}

.otp-boxes input{
    width:100%;
    min-width:0;

    height:56px;

    border:1.5px solid #ddd;
    outline:0;

    border-radius:12px;

    text-align:center;

    font-size:20px;
    font-weight:700;

    color:#222;
}

.otp-boxes input:focus{
    border-color:#078d39;

    box-shadow:
        0 0 0 3px rgba(7,141,57,.07);
}

.otp-mobile{
    color:#078d39;
    font-weight:600;
}


/* =========================
   CHANGE NUMBER
========================= */

.change-number{
    margin-top:16px;

    border:0;
    background:transparent;

    color:#078d39;

    font-size:13px;
    font-weight:600;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .cezoo-logo{
        font-size:44px;
        margin-top:50px;
    }

    .hero-text{
        font-size:19px;
        margin-top:24px;
    }

    .login-character{
        width:77vw;
    }

    .login-character img{
        max-height:390px;
    }

    .login-sheet{
        border-radius:27px 27px 0 0;

        padding-left:22px;
        padding-right:22px;
    }

    .login-page.sheet-open .login-sheet{
        min-height:57vh;
    }

    .step-title{
        font-size:21px;
    }

}

</style>
</head>


<body>

<div
    class="login-page"
    id="loginPage"
>


    <!-- =========================
         GREEN BACKGROUND
    ========================== -->

    <section class="login-hero">


        <!-- BACK -->

        <button
            class="back-btn"
            onclick="loginBack()"
            aria-label="Back"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <!-- CEZOO -->

        <div class="cezoo-logo">
            CEZOO
        </div>


        <!-- TEXT -->

        <div class="hero-text">

            Groceries delivered<br>

            <span>
                in minutes
            </span>

        </div>


        <!-- IMAGE -->

        <div class="login-character">

            <img
                src="god.webp"
                alt="CEZOO"
            >

        </div>


    </section>



    <!-- =========================
         WHITE BOTTOM SHEET
    ========================== -->

    <section
        class="login-sheet"
        id="loginSheet"
    >


        <!-- =====================
             FIRST SCREEN
        ====================== -->

        <div class="sheet-intro">


            <button
                class="phone-login-btn"
                onclick="startLogin()"
            >

                Log in with phone number

            </button>


            <div class="terms-line"></div>


            <div class="terms">

                By tapping, I accept the

                <a href="#">
                    terms of service
                </a>

                &amp;

                <a href="#">
                    privacy policy
                </a>

            </div>


        </div>



        <!-- =====================
             FORM INSIDE SAME SHEET
        ====================== -->

        <div class="sheet-form">


            <!-- =================
                 NAME
            ================== -->

            <div
                class="login-step active"
                id="nameStep"
            >

                <div class="sheet-brand">
                    CEZOO
                </div>


                <div class="step-title">
                    What's your name?
                </div>


                <div class="step-subtitle">
                    Tell us what we should call you
                </div>


                <div class="input-box">

                    <input
                        type="text"
                        id="nameInput"
                        placeholder="Enter your name"
                        autocomplete="name"
                    >

                </div>


                <button
                    class="next-btn"
                    onclick="goMobile()"
                >
                    Next
                </button>


            </div>



            <!-- =================
                 MOBILE
            ================== -->

            <div
                class="login-step"
                id="mobileStep"
            >

                <div class="sheet-brand">
                    CEZOO
                </div>


                <div class="step-title">
                    Enter your mobile number
                </div>


                <div class="step-subtitle">
                    We'll send you an OTP for verification
                </div>


                <div class="input-box mobile-box">

                    <div class="mobile-prefix">
                        +91
                    </div>


                    <input
                        type="tel"
                        id="mobileInput"
                        placeholder="Mobile number"
                        maxlength="10"
                        inputmode="numeric"
                    >

                </div>


                <button
                    class="next-btn"
                    onclick="goOtp()"
                >
                    Next
                </button>


            </div>



            <!-- =================
                 OTP
            ================== -->

            <div
                class="login-step"
                id="otpStep"
            >

                <div class="sheet-brand">
                    CEZOO
                </div>


                <div class="step-title">
                    Enter OTP
                </div>


                <div class="step-subtitle">

                    We've sent the OTP to

                    <span
                        class="otp-mobile"
                        id="otpMobile"
                    ></span>

                </div>


                <div class="otp-boxes">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                </div>


                <button
                    class="next-btn"
                    onclick="verifyOtp()"
                >
                    Verify & Continue
                </button>


                <button
                    class="change-number"
                    onclick="showStep('mobile')"
                >
                    Change mobile number
                </button>


            </div>


        </div>


    </section>


</div>


<script>

const loginPage =
    document.getElementById("loginPage");

let currentStep = "intro";


/* =========================
   OPEN WHITE SHEET
========================= */

function startLogin(){

    currentStep = "name";

    loginPage.classList.add(
        "sheet-open"
    );

    showStep("name");

    setTimeout(() => {

        document
            .getElementById("nameInput")
            .focus();

    },400);

}


/* =========================
   SHOW STEP
========================= */

function showStep(step){

    document
        .querySelectorAll(".login-step")
        .forEach(element => {

            element.classList.remove(
                "active"
            );

        });


    if(step === "name"){

        currentStep = "name";

        document
            .getElementById("nameStep")
            .classList.add("active");

    }


    if(step === "mobile"){

        currentStep = "mobile";

        document
            .getElementById("mobileStep")
            .classList.add("active");

    }


    if(step === "otp"){

        currentStep = "otp";

        document
            .getElementById("otpStep")
            .classList.add("active");

    }

}


/* =========================
   NAME NEXT
========================= */

function goMobile(){

    const name =
        document
            .getElementById("nameInput")
            .value
            .trim();


    if(name.length < 2){

        alert(
            "Please enter your name"
        );

        return;
    }


    showStep("mobile");


    setTimeout(() => {

        document
            .getElementById("mobileInput")
            .focus();

    },150);

}


/* =========================
   MOBILE NEXT
========================= */

function goOtp(){

    const mobileInput =
        document.getElementById(
            "mobileInput"
        );


    const mobile =
        mobileInput.value
            .replace(/\D/g,"")
            .slice(0,10);


    mobileInput.value =
        mobile;


    if(mobile.length !== 10){

        alert(
            "Please enter a valid 10 digit mobile number"
        );

        return;
    }


    document
        .getElementById("otpMobile")
        .textContent =
        "+91 " + mobile;


    showStep("otp");


    setTimeout(() => {

        otpInputs[0]?.focus();

    },150);

}


/* =========================
   OTP AUTO MOVE
========================= */

const otpInputs =
    Array.from(
        document.querySelectorAll(
            ".otp-boxes input"
        )
    );


otpInputs.forEach(
    (input,index) => {


        input.addEventListener(
            "input",
            function(){

                this.value =
                    this.value
                        .replace(/\D/g,"")
                        .slice(0,1);


                if(
                    this.value &&
                    index <
                    otpInputs.length - 1
                ){

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Backspace" &&
                    !this.value &&
                    index > 0
                ){

                    otpInputs[
                        index - 1
                    ].focus();

                }

            }
        );

    }
);


/* =========================
   VERIFY DEMO
========================= */

function verifyOtp(){

    const otp =
        otpInputs
            .map(input => input.value)
            .join("");


    if(otp.length !== 6){

        alert(
            "Please enter complete OTP"
        );

        return;
    }


    /*
       DEMO ONLY BRO.

       Later existing Firebase OTP
       verification ikkada connect chestham.
    */

    alert(
        "OTP UI completed"
    );

}


/* =========================
   BACK
========================= */

function loginBack(){


    if(currentStep === "otp"){

        showStep("mobile");

        return;
    }


    if(currentStep === "mobile"){

        showStep("name");

        return;
    }


    if(currentStep === "name"){

        currentStep = "intro";

        loginPage.classList.remove(
            "sheet-open"
        );

        return;
    }


    if(window.history.length > 1){

        history.back();

    }

}

</script>

</body>
</html>
