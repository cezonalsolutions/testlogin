<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Login</title>

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#07913d;
}

button,
input{
    font-family:'Poppins',sans-serif;
}

/* =========================
   PAGE
========================= */

.login-page{
    width:100%;
    min-height:100dvh;
    background:#07913d;
    display:flex;
    flex-direction:column;
}

/* =========================
   GREEN HERO
========================= */

.login-hero{
    position:relative;
    flex:1;
    min-height:68vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:hidden;

    padding:
        calc(35px + env(safe-area-inset-top))
        20px
        0;
}

/* LIGHT BACKGROUND LINES */

.login-hero::before{
    content:"";

    position:absolute;
    inset:-100px;

    background-image:

        linear-gradient(
            45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        ),

        linear-gradient(
            -45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        );

    background-size:85px 85px;

    pointer-events:none;
}

/* =========================
   BACK BUTTON
========================= */

.back-btn{
    position:absolute;

    top:calc(35px + env(safe-area-inset-top));
    left:22px;

    z-index:20;

    width:42px;
    height:42px;

    border:0;
    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(255,255,255,.85);

    font-size:27px;

    cursor:pointer;
}

/* =========================
   CEZOO
========================= */

.cezoo-logo{
    position:relative;
    z-index:2;

    margin-top:55px;

    font-family:'Bungee',sans-serif;

    font-size:50px;
    line-height:1;

    color:#fff;

    letter-spacing:1px;

    text-shadow:
        0 4px 0 rgba(0,0,0,.13);

    transition:
        font-size .3s ease,
        margin .3s ease;
}

/* LOGIN STEPS OPEN AYYAKA
   CEZOO BIG */

.login-page.form-open .cezoo-logo{
    font-size:58px;
    margin-top:70px;
}

/* =========================
   HERO TEXT
========================= */

.hero-text{
    position:relative;
    z-index:2;

    margin-top:27px;

    text-align:center;

    font-size:21px;
    line-height:1.35;

    font-weight:700;

    color:#fff;
}

.hero-text span{
    color:#ffe82e;
}

/* =========================
   CHARACTER IMAGE
========================= */

.login-character{
    position:relative;
    z-index:2;

    margin-top:5px;

    flex:1;

    width:min(78vw,390px);

    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.login-character img{
    width:100%;
    max-height:430px;

    display:block;

    object-fit:contain;
    object-position:center bottom;
}

/* FORM OPEN AYYAKA
   TEXT + IMAGE HIDE */

.login-page.form-open .hero-text,
.login-page.form-open .login-character{
    display:none;
}

/* =========================
   FORM AREA INSIDE GREEN
========================= */

.login-form-area{
    position:relative;
    z-index:5;

    width:100%;
    max-width:430px;

    display:none;

    padding:0 5px;

    margin-top:55px;
}

.login-page.form-open .login-form-area{
    display:block;
}

/* =========================
   STEPS
========================= */

.login-step{
    display:none;

    animation:
        loginStepIn .25s ease;
}

.login-step.active{
    display:block;
}

@keyframes loginStepIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =========================
   STEP TEXT
========================= */

.step-title{
    color:#fff;

    font-size:24px;
    font-weight:700;

    line-height:1.25;
}

.step-subtitle{
    margin-top:7px;

    color:rgba(255,255,255,.72);

    font-size:13px;
    line-height:1.5;
}

/* =========================
   INPUT
========================= */

.input-box{
    width:100%;
    height:60px;

    margin-top:22px;

    background:#fff;

    border:2px solid transparent;

    border-radius:16px;

    display:flex;
    align-items:center;

    overflow:hidden;

    transition:.2s ease;
}

.input-box:focus-within{
    border-color:#ffe82e;
}

.input-box input{
    width:100%;
    height:100%;

    padding:0 18px;

    border:0;
    outline:0;

    background:transparent;

    color:#171717;

    font-size:16px;
    font-weight:500;
}

.input-box input::placeholder{
    color:#aaa;
}

/* =========================
   MOBILE PREFIX
========================= */

.mobile-prefix{
    height:26px;

    display:flex;
    align-items:center;

    padding-left:18px;
    padding-right:13px;

    border-right:1px solid #ddd;

    color:#222;

    font-size:15px;
    font-weight:600;

    flex-shrink:0;
}

.mobile-box input{
    padding-left:13px;
}

/* =========================
   NEXT BUTTON
========================= */

.next-btn{
    width:100%;
    height:58px;

    margin-top:15px;

    border:0;

    border-radius:16px;

    background:#ffe82e;

    color:#09652e;

    font-size:16px;
    font-weight:700;

    cursor:pointer;
}

.next-btn:active{
    transform:scale(.985);
}

/* =========================
   OTP
========================= */

.otp-boxes{
    display:flex;

    justify-content:space-between;

    gap:10px;

    margin-top:22px;
}

.otp-boxes input{
    width:100%;
    min-width:0;
    height:58px;

    border:2px solid transparent;
    outline:0;

    border-radius:14px;

    background:#fff;

    text-align:center;

    font-size:21px;
    font-weight:700;

    color:#222;
}

.otp-boxes input:focus{
    border-color:#ffe82e;
}

.otp-mobile-text{
    color:#ffe82e;
    font-weight:600;
}

/* =========================
   BOTTOM
========================= */

.login-bottom{
    position:relative;
    z-index:10;

    background:#fff;

    border-radius:30px 30px 0 0;

    padding:
        28px
        24px
        calc(28px + env(safe-area-inset-bottom));

    text-align:center;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.045);
}

/* MAIN LOGIN BUTTON */

.phone-login-btn{
    width:100%;
    height:60px;

    border:0;

    border-radius:30px;

    background:#078d39;

    color:#fff;

    font-size:17px;
    font-weight:600;

    cursor:pointer;
}

.phone-login-btn:active{
    transform:scale(.985);
}

/* FORM OPEN AYYAKA
   MAIN BUTTON HIDE */

.login-page.form-open .phone-login-btn{
    display:none;
}

/* =========================
   DASH LINE
========================= */

.terms-line{
    width:100%;

    margin:25px 0 18px;

    border-top:
        1px dashed
        rgba(100,100,100,.28);
}

/* =========================
   TERMS
========================= */

.terms{
    color:#999;

    font-size:11.5px;

    line-height:1.65;
}

.terms a{
    color:#777;

    font-weight:600;

    text-decoration:underline;
}

/* =========================
   FORM OPEN BOTTOM SMALL
========================= */

.login-page.form-open .login-bottom{
    padding-top:20px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .cezoo-logo{
        font-size:44px;
        margin-top:50px;
    }

    .login-page.form-open .cezoo-logo{
        font-size:53px;
        margin-top:65px;
    }

    .hero-text{
        font-size:19px;
        margin-top:24px;
    }

    .login-character{
        width:77vw;
        margin-top:4px;
    }

    .login-character img{
        max-height:390px;
    }

    .login-form-area{
        margin-top:48px;
    }

    .step-title{
        font-size:22px;
    }

    .login-bottom{
        border-radius:27px 27px 0 0;

        padding-left:22px;
        padding-right:22px;
    }

}

</style>
</head>

<body>

<div class="login-page" id="loginPage">

    <!-- =========================
         GREEN SECTION
    ========================== -->

    <section class="login-hero">

        <!-- BACK -->
        <button
            class="back-btn"
            onclick="loginBack()"
            aria-label="Back"
        >
            <i class="fa-solid fa-arrow-left"></i>
        </button>


        <!-- CEZOO -->
        <div class="cezoo-logo">
            CEZOO
        </div>


        <!-- INTRO TEXT -->
        <div class="hero-text">

            Groceries delivered<br>

            <span>
                in minutes
            </span>

        </div>


        <!-- IMAGE -->
        <div class="login-character">

            <img
                src="god.webp"
                alt="CEZOO"
            >

        </div>


        <!-- =========================
             LOGIN FORM
        ========================== -->

        <div class="login-form-area">


            <!-- STEP 1 : NAME -->

            <div
                class="login-step active"
                id="nameStep"
            >

                <div class="step-title">
                    What's your name?
                </div>

                <div class="step-subtitle">
                    Enter your name to continue
                </div>

                <div class="input-box">

                    <input
                        type="text"
                        id="nameInput"
                        placeholder="Enter your name"
                        autocomplete="name"
                    >

                </div>

                <button
                    class="next-btn"
                    onclick="goToMobile()"
                >
                    Next
                </button>

            </div>


            <!-- STEP 2 : MOBILE -->

            <div
                class="login-step"
                id="mobileStep"
            >

                <div class="step-title">
                    Enter mobile number
                </div>

                <div class="step-subtitle">
                    We'll send an OTP to verify your number
                </div>

                <div class="input-box mobile-box">

                    <div class="mobile-prefix">
                        +91
                    </div>

                    <input
                        type="tel"
                        id="mobileInput"
                        placeholder="Mobile number"
                        maxlength="10"
                        inputmode="numeric"
                    >

                </div>

                <button
                    class="next-btn"
                    onclick="goToOtp()"
                >
                    Next
                </button>

            </div>


            <!-- STEP 3 : OTP -->

            <div
                class="login-step"
                id="otpStep"
            >

                <div class="step-title">
                    Verify OTP
                </div>

                <div class="step-subtitle">

                    Enter the OTP sent to

                    <span
                        class="otp-mobile-text"
                        id="otpMobileText"
                    ></span>

                </div>


                <div class="otp-boxes">

                    <input
                        type="tel"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        type="tel"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        type="tel"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        type="tel"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        type="tel"
                        maxlength="1"
                        inputmode="numeric"
                    >

                    <input
                        type="tel"
                        maxlength="1"
                        inputmode="numeric"
                    >

                </div>


                <button
                    class="next-btn"
                    onclick="demoLogin()"
                >
                    Verify & Login
                </button>

            </div>


        </div>

    </section>


    <!-- =========================
         BOTTOM
    ========================== -->

    <section class="login-bottom">

        <button
            class="phone-login-btn"
            onclick="startPhoneLogin()"
        >
            Log in with phone number
        </button>


        <div class="terms-line"></div>


        <div class="terms">

            By tapping, I accept the

            <a href="#">
                terms of service
            </a>

            &amp;

            <a href="#">
                privacy policy
            </a>

        </div>

    </section>

</div>


<script>

const loginPage =
    document.getElementById("loginPage");

let currentStep = "intro";


/* =========================
   SHOW STEP
========================= */

function showLoginStep(stepId){

    document
        .querySelectorAll(".login-step")
        .forEach(step => {
            step.classList.remove("active");
        });

    document
        .getElementById(stepId)
        .classList.add("active");

}


/* =========================
   START LOGIN
========================= */

function startPhoneLogin(){

    currentStep = "name";

    loginPage.classList.add("form-open");

    showLoginStep("nameStep");

    setTimeout(() => {
        document
            .getElementById("nameInput")
            .focus();
    },250);

}


/* =========================
   NAME → MOBILE
========================= */

function goToMobile(){

    const name =
        document
            .getElementById("nameInput")
            .value
            .trim();

    if(name.length < 2){

        alert("Please enter your name");

        return;
    }

    currentStep = "mobile";

    showLoginStep("mobileStep");

    setTimeout(() => {
        document
            .getElementById("mobileInput")
            .focus();
    },100);

}


/* =========================
   MOBILE → OTP
========================= */

function goToOtp(){

    const mobileInput =
        document.getElementById("mobileInput");

    const mobile =
        mobileInput.value
            .replace(/\D/g,"")
            .slice(0,10);

    mobileInput.value = mobile;

    if(mobile.length !== 10){

        alert(
            "Please enter a valid 10 digit mobile number"
        );

        return;
    }

    document
        .getElementById("otpMobileText")
        .textContent =
        "+91 " + mobile;

    currentStep = "otp";

    showLoginStep("otpStep");

    const firstOtp =
        document.querySelector(
            ".otp-boxes input"
        );

    setTimeout(() => {
        firstOtp?.focus();
    },100);

}


/* =========================
   OTP AUTO NEXT
========================= */

const otpInputs =
    Array.from(
        document.querySelectorAll(
            ".otp-boxes input"
        )
    );

otpInputs.forEach(
    (input,index) => {

        input.addEventListener(
            "input",
            function(){

                this.value =
                    this.value
                        .replace(/\D/g,"")
                        .slice(0,1);

                if(
                    this.value &&
                    index <
                    otpInputs.length - 1
                ){

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                        "Backspace" &&
                    !this.value &&
                    index > 0
                ){

                    otpInputs[
                        index - 1
                    ].focus();

                }

            }
        );

    }
);


/* =========================
   BACK
========================= */

function loginBack(){

    if(currentStep === "otp"){

        currentStep = "mobile";

        showLoginStep(
            "mobileStep"
        );

        return;
    }


    if(currentStep === "mobile"){

        currentStep = "name";

        showLoginStep(
            "nameStep"
        );

        return;
    }


    if(currentStep === "name"){

        currentStep = "intro";

        loginPage
            .classList
            .remove("form-open");

        return;
    }


    /* intro screen back */

    if(
        window.history.length > 1
    ){
        history.back();
    }

}


/* =========================
   DEMO VERIFY
========================= */

function demoLogin(){

    const otp =
        otpInputs
            .map(input => input.value)
            .join("");

    if(otp.length !== 6){

        alert(
            "Please enter complete OTP"
        );

        return;
    }

    /*
      UI DEMO ONLY.

      Later ikkada mana existing
      Firebase OTP verification
      connect cheddam.
    */

    alert("OTP UI completed");

}

</script>

</body>
</html>
