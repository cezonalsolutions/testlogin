<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>CEZOO Login</title>

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
}

body{
    position:fixed;
    inset:0;

    font-family:'Poppins',sans-serif;

    background:#07913d;
}

button,
input{
    font-family:'Poppins',sans-serif;
}


/* =========================
   FULL PAGE
========================= */

.login-page{
    position:fixed;
    inset:0;

    width:100%;
    height:100dvh;

    overflow:hidden;

    background:#07913d;
}


/* =========================
   GREEN HERO
========================= */

.login-hero{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:
        calc(35px + env(safe-area-inset-top))
        20px
        0;

    overflow:hidden;
}


/* =========================
   LIGHT BACKGROUND LINES
========================= */

.login-hero::before{

    content:"";

    position:absolute;
    inset:-100px;

    background-image:

        linear-gradient(
            45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        ),

        linear-gradient(
            -45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        );

    background-size:85px 85px;

    pointer-events:none;
}


/* =========================
   BACK
========================= */

.back-btn{

    position:absolute;

    top:calc(35px + env(safe-area-inset-top));
    left:22px;

    z-index:50;

    width:42px;
    height:42px;

    border:0;
    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(255,255,255,.82);

    font-size:27px;

    cursor:pointer;
}


/* =========================
   CEZOO
========================= */

.cezoo-logo{

    position:relative;
    z-index:2;

    margin-top:55px;

    font-family:'Bungee',sans-serif;

    font-size:50px;
    line-height:1;

    letter-spacing:1px;

    color:#fff;

    text-shadow:
        0 4px 0 rgba(0,0,0,.13);
}


/* =========================
   HERO TEXT
========================= */

.hero-text{

    position:relative;
    z-index:2;

    margin-top:27px;

    text-align:center;

    font-size:21px;
    line-height:1.35;

    font-weight:700;

    color:#fff;
}

.hero-text span{
    color:#ffe82e;
}


/* =========================
   IMAGE

   IMPORTANT:
   LOGIN OPEN AYYINA
   IMAGE POSITION CHANGE AVVADU
========================= */

.login-character{

    position:relative;
    z-index:2;

    margin-top:5px;

    flex:1;

    width:min(78vw,390px);

    display:flex;
    align-items:flex-end;
    justify-content:center;
}

.login-character img{

    width:100%;

    max-height:430px;

    display:block;

    object-fit:contain;
    object-position:center bottom;
}


/*
   IMAGE KI LOGIN-OPEN
   CSS EMI LEDU.

   SO IMAGE MOVE/HIDE AVVADU.
   WHITE SHEET IMAGE NI
   COVER CHESTUNDI.
*/


/* =========================
   WHITE BOTTOM SHEET
========================= */

.login-bottom{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:20;

    height:190px;

    background:#fff;

    border-radius:30px 30px 0 0;

    padding:
        28px
        24px
        calc(25px + env(safe-area-inset-bottom));

    box-shadow:
        0 -4px 18px rgba(0,0,0,.06);

    text-align:center;

    overflow:hidden;

    transition:
        height .34s cubic-bezier(.22,.75,.25,1);
}


/* =========================
   SHEET OPEN

   ONLY SHEET HEIGHT CHANGES
   PAGE / IMAGE / HERO
   CHANGE AVVAVU
========================= */

.login-page.login-open .login-bottom{

    height:430px;

    padding-top:24px;

    text-align:left;
}


/* =========================
   FIRST SCREEN CONTENT
========================= */

.first-login-content{
    display:block;
}

.login-page.login-open
.first-login-content{
    display:none;
}


/* =========================
   LOGIN BUTTON
========================= */

.phone-login-btn{

    width:100%;
    height:60px;

    border:0;

    border-radius:30px;

    background:#078d39;

    color:#fff;

    font-size:17px;
    font-weight:600;

    cursor:pointer;
}

.phone-login-btn:active{
    transform:scale(.985);
}


/* =========================
   TERMS LINE
========================= */

.terms-line{

    width:100%;

    margin:25px 0 18px;

    border-top:
        1px dashed
        rgba(100,100,100,.28);
}


/* =========================
   TERMS
========================= */

.terms{

    color:#999;

    font-size:11.5px;
    line-height:1.65;

    text-align:center;
}

.terms a{

    color:#777;

    font-weight:600;

    text-decoration:underline;
}


/* =========================
   FORM
========================= */

.login-form{
    display:none;

    width:100%;

    max-width:480px;

    margin:0 auto;
}

.login-page.login-open
.login-form{
    display:block;
}


/* =========================
   STEPS
========================= */

.login-step{
    display:none;
}

.login-step.active{

    display:block;

    animation:
        stepIn .22s ease;
}

@keyframes stepIn{

    from{
        opacity:0;
        transform:translateX(8px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }
}


/* =========================
   TITLE
========================= */

.form-title{

    color:#161616;

    font-size:22px;
    line-height:1.3;

    font-weight:700;
}

.form-subtitle{

    margin-top:6px;

    color:#8b8b8b;

    font-size:13px;
    line-height:1.5;
}


/* =========================
   INPUT
========================= */

.input-box{

    width:100%;
    height:58px;

    margin-top:19px;

    display:flex;
    align-items:center;

    background:#fff;

    border:1.5px solid #dedede;

    border-radius:15px;

    overflow:hidden;
}

.input-box:focus-within{

    border-color:#078d39;

    box-shadow:
        0 0 0 3px
        rgba(7,141,57,.07);
}


.input-box input{

    width:100%;
    height:100%;

    border:0;
    outline:0;

    padding:0 16px;

    background:transparent;

    color:#171717;

    font-size:16px;
    font-weight:500;
}

.input-box input::placeholder{
    color:#aaa;
}


/* =========================
   MOBILE PREFIX
========================= */

.mobile-prefix{

    height:26px;

    padding:
        0 14px
        0 17px;

    display:flex;
    align-items:center;

    border-right:1px solid #ddd;

    color:#222;

    font-size:15px;
    font-weight:600;

    flex-shrink:0;
}

.mobile-box input{
    padding-left:13px;
}


/* =========================
   NEXT
========================= */

.next-btn{

    width:100%;
    height:56px;

    margin-top:14px;

    border:0;

    border-radius:15px;

    background:#078d39;

    color:#fff;

    font-size:16px;
    font-weight:600;

    cursor:pointer;
}

.next-btn:active{
    transform:scale(.985);
}


/* =========================
   OTP
========================= */

.otp-boxes{

    width:100%;

    display:flex;

    gap:7px;

    margin-top:20px;
}

.otp-boxes input{

    width:100%;
    min-width:0;

    height:54px;

    border:1.5px solid #ddd;
    outline:0;

    border-radius:11px;

    background:#fff;

    text-align:center;

    color:#171717;

    font-size:20px;
    font-weight:700;
}

.otp-boxes input:focus{

    border-color:#078d39;

    box-shadow:
        0 0 0 3px
        rgba(7,141,57,.07);
}

.otp-number{

    color:#078d39;

    font-weight:600;
}


/* =========================
   RESEND
========================= */

.resend-btn{

    display:block;

    margin:16px auto 0;

    border:0;
    background:transparent;

    color:#078d39;

    font-size:13px;
    font-weight:600;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .cezoo-logo{

        font-size:44px;

        margin-top:50px;
    }

    .hero-text{

        font-size:19px;

        margin-top:24px;
    }

    .login-character{

        width:77vw;

        margin-top:4px;
    }

    .login-character img{
        max-height:390px;
    }


    .login-bottom{

        height:190px;

        border-radius:
            27px 27px 0 0;

        padding-left:22px;
        padding-right:22px;
    }


    /*
       SHEET OPEN HEIGHT

       IMAGE/HERO POSITION
       TOUCH CHEYYATLEDU
    */

    .login-page.login-open
    .login-bottom{

        height:410px;

        padding-top:22px;
    }


    .form-title{
        font-size:21px;
    }
}


/* =========================
   SHORT SCREEN
========================= */

@media(max-height:650px){

    .login-page.login-open
    .login-bottom{

        height:390px;
    }

}

</style>
</head>


<body>

<div
    class="login-page"
    id="loginPage"
>


<!-- =========================
     GREEN HERO
========================= -->

<section class="login-hero">


    <!-- BACK -->

    <button
        class="back-btn"
        onclick="loginBack()"
        aria-label="Back"
    >

        <i class="fa-solid fa-arrow-left"></i>

    </button>


    <!-- CEZOO -->

    <div class="cezoo-logo">
        CEZOO
    </div>


    <!-- TEXT -->

    <div class="hero-text">

        Groceries delivered<br>

        <span>
            in minutes
        </span>

    </div>


    <!-- IMAGE -->

    <div class="login-character">

        <img
            src="god.webp"
            alt="CEZOO"
        >

    </div>


</section>



<!-- =========================
     WHITE BOTTOM SHEET
========================= -->

<section
    class="login-bottom"
    id="loginBottom"
>


    <!-- =====================
         FIRST SCREEN
    ====================== -->

    <div class="first-login-content">


        <button
            class="phone-login-btn"
            onclick="startLogin()"
        >

            Log in with phone number

        </button>


        <div class="terms-line"></div>


        <div class="terms">

            By tapping, I accept the

            <a href="#">
                terms of service
            </a>

            &amp;

            <a href="#">
                privacy policy
            </a>

        </div>


    </div>



    <!-- =====================
         LOGIN FORM
    ====================== -->

    <div class="login-form">


        <!-- =================
             STEP 1 NAME
        ================== -->

        <div
            class="login-step active"
            id="nameStep"
        >


            <div class="form-title">
                What's your name?
            </div>


            <div class="form-subtitle">
                Enter your name to continue
            </div>


            <div class="input-box">

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <button
                class="next-btn"
                onclick="openMobile()"
            >
                Next
            </button>


        </div>



        <!-- =================
             STEP 2 MOBILE
        ================== -->

        <div
            class="login-step"
            id="mobileStep"
        >


            <div class="form-title">
                Enter your mobile number
            </div>


            <div class="form-subtitle">
                We'll send an OTP to verify your number
            </div>


            <div class="input-box mobile-box">


                <div class="mobile-prefix">
                    +91
                </div>


                <input
                    type="tel"
                    id="mobileInput"
                    placeholder="Enter mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                >


            </div>


            <button
                class="next-btn"
                onclick="openOtp()"
            >
                Next
            </button>


        </div>



        <!-- =================
             STEP 3 OTP
        ================== -->

        <div
            class="login-step"
            id="otpStep"
        >


            <div class="form-title">
                Enter OTP
            </div>


            <div class="form-subtitle">

                OTP sent to

                <span
                    class="otp-number"
                    id="otpNumber"
                ></span>

            </div>


            <div class="otp-boxes">

                <input type="tel" maxlength="1" inputmode="numeric">

                <input type="tel" maxlength="1" inputmode="numeric">

                <input type="tel" maxlength="1" inputmode="numeric">

                <input type="tel" maxlength="1" inputmode="numeric">

                <input type="tel" maxlength="1" inputmode="numeric">

                <input type="tel" maxlength="1" inputmode="numeric">

            </div>


            <button
                class="next-btn"
                onclick="verifyOtp()"
            >
                Verify & Continue
            </button>


            <button
                class="resend-btn"
                type="button"
            >
                Resend OTP
            </button>


        </div>


    </div>


</section>

</div>


<script>

const loginPage =
    document.getElementById("loginPage");

const nameStep =
    document.getElementById("nameStep");

const mobileStep =
    document.getElementById("mobileStep");

const otpStep =
    document.getElementById("otpStep");

const nameInput =
    document.getElementById("nameInput");

const mobileInput =
    document.getElementById("mobileInput");

const otpNumber =
    document.getElementById("otpNumber");

let currentStep = "home";


/* =========================
   SHOW STEP
========================= */

function showStep(step){

    nameStep.classList.remove("active");
    mobileStep.classList.remove("active");
    otpStep.classList.remove("active");


    if(step === "name"){

        currentStep = "name";

        nameStep.classList.add("active");
    }


    if(step === "mobile"){

        currentStep = "mobile";

        mobileStep.classList.add("active");
    }


    if(step === "otp"){

        currentStep = "otp";

        otpStep.classList.add("active");
    }

}


/* =========================
   LOGIN CLICK
========================= */

function startLogin(){

    showStep("name");


    /*
       ONLY WHITE SHEET OPEN
    */

    loginPage.classList.add(
        "login-open"
    );


    /*
       PAGE SCROLL CHEYYAKUNDA
       INPUT FOCUS
    */

    try{

        nameInput.focus({
            preventScroll:true
        });

    }catch(e){

        nameInput.focus();

    }

}


/* =========================
   NAME → MOBILE
========================= */

function openMobile(){

    const name =
        nameInput.value.trim();


    if(name.length < 2){

        alert(
            "Please enter your name"
        );

        try{
            nameInput.focus({
                preventScroll:true
            });
        }catch(e){
            nameInput.focus();
        }

        return;
    }


    showStep("mobile");


    try{

        mobileInput.focus({
            preventScroll:true
        });

    }catch(e){

        mobileInput.focus();

    }

}


/* =========================
   MOBILE ONLY NUMBERS
========================= */

mobileInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);


/* =========================
   MOBILE → OTP
========================= */

function openOtp(){

    const mobile =
        mobileInput.value
            .replace(/\D/g,"");


    if(mobile.length !== 10){

        alert(
            "Please enter valid 10 digit mobile number"
        );

        return;
    }


    otpNumber.textContent =
        "+91 " + mobile;


    showStep("otp");


    try{

        otpInputs[0].focus({
            preventScroll:true
        });

    }catch(e){

        otpInputs[0].focus();

    }

}


/* =========================
   OTP INPUTS
========================= */

const otpInputs =
    Array.from(
        document.querySelectorAll(
            ".otp-boxes input"
        )
    );


otpInputs.forEach(
(input,index)=>{


    input.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,1);


        if(
            this.value &&
            index < otpInputs.length - 1
        ){

            otpInputs[index + 1]
                .focus({
                    preventScroll:true
                });

        }

    });


    input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Backspace" &&
            !this.value &&
            index > 0
        ){

            otpInputs[index - 1]
                .focus({
                    preventScroll:true
                });

        }

    });

});


/* =========================
   VERIFY
========================= */

function verifyOtp(){

    const otp =
        otpInputs
            .map(input => input.value)
            .join("");


    if(otp.length !== 6){

        alert(
            "Please enter complete OTP"
        );

        return;
    }


    /*
       UI DEMO ONLY
    */

    alert("OTP completed");

}


/* =========================
   BACK
========================= */

function loginBack(){


    /* OTP → MOBILE */

    if(currentStep === "otp"){

        showStep("mobile");

        return;
    }


    /* MOBILE → NAME */

    if(currentStep === "mobile"){

        showStep("name");

        return;
    }


    /* NAME → FIRST SCREEN */

    if(currentStep === "name"){

        currentStep = "home";

        document.activeElement?.blur();

        loginPage.classList.remove(
            "login-open"
        );

        return;
    }


    /* NORMAL PAGE BACK */

    if(window.history.length > 1){

        history.back();

    }

}

</script>

</body>
</html>
