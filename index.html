<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Location</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#fff;
}


/* =========================
   TOP LOCATION
========================= */

.locationTop{
    width:100%;
    padding:18px 16px 12px;
    background:#fff;
}

.locationTitle{
    display:flex;
    align-items:center;
    gap:6px;

    font-size:18px;
    font-weight:700;
    color:#181818;
}

.locationArrow{
    width:7px;
    height:7px;

    border-right:2px solid #333;
    border-bottom:2px solid #333;

    transform:rotate(45deg);
    margin-top:-4px;
}

.locationAddress{
    margin-top:4px;
    max-width:90%;

    font-size:12px;
    font-weight:400;
    color:#666;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   VIDEO AREA
========================= */

.videoArea{
    width:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-top:14px;

    /* NO VIDEO CONTAINER BG */
    background:none !important;
    background-color:transparent !important;
}


/* =========================
   WEBM VIDEO
========================= */

.locationVideo{
    width:65%;
    max-width:420px;

    height:auto;
    display:block;

    object-fit:contain;

    /* NO BLACK / WHITE VIDEO BG */
    background:none !important;
    background-color:transparent !important;

    border:0;
    outline:0;
    box-shadow:none;

    -webkit-appearance:none;
    appearance:none;
}


/* MOBILE */

@media(max-width:480px){

    .locationVideo{
        width:65%;
        max-width:360px;
        height:auto;
    }

}
</style>
</head>

<body>


<!-- =========================
     TOP LOCATION
========================= -->

<div class="locationTop">

    <div class="locationTitle">
        <span>Current Location</span>
        <span class="locationArrow"></span>
    </div>

    <div class="locationAddress">
        Tanuku, Andhra Pradesh
    </div>

</div>


<!-- =========================
     TRANSPARENT WEBM VIDEO
========================= -->

<div class="videoArea">

    <video
        class="locationVideo"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        disablepictureinpicture
    >
        <source src="balons.webm" type="video/webm">
    </video>

</div>


</body>
</html>
