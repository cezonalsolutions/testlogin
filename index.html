<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CEZOO Login</title>

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Poppins',sans-serif;
    background:#07913d;
}

button,
input{
    font-family:'Poppins',sans-serif;
}

/* =========================
   FULL PAGE
========================= */

.login-page{
    width:100%;
    min-height:100dvh;

    background:#07913d;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* =========================
   GREEN HERO
========================= */

.login-hero{
    position:relative;

    flex:1;
    min-height:68vh;

    display:flex;
    flex-direction:column;
    align-items:center;

    overflow:hidden;

    padding:
        calc(35px + env(safe-area-inset-top))
        20px
        0;

    transition:
        min-height .35s ease,
        flex .35s ease;
}


/* =========================
   LIGHT BACKGROUND LINES
========================= */

.login-hero::before{

    content:"";

    position:absolute;
    inset:-100px;

    background-image:

        linear-gradient(
            45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        ),

        linear-gradient(
            -45deg,
            transparent 49%,
            rgba(255,255,255,.055) 49.5%,
            rgba(255,255,255,.055) 50.5%,
            transparent 51%
        );

    background-size:85px 85px;

    pointer-events:none;
}


/* =========================
   BACK BUTTON
========================= */

.back-btn{

    position:absolute;

    top:calc(35px + env(safe-area-inset-top));
    left:22px;

    z-index:20;

    width:42px;
    height:42px;

    border:none;
    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    color:rgba(255,255,255,.82);

    font-size:27px;

    cursor:pointer;
}


/* =========================
   CEZOO
========================= */

.cezoo-logo{

    position:relative;
    z-index:2;

    margin-top:55px;

    font-family:'Bungee',sans-serif;

    font-size:50px;
    line-height:1;

    letter-spacing:1px;

    color:#ffffff;

    text-shadow:
        0 4px 0 rgba(0,0,0,.13);
}


/* =========================
   HERO TEXT
========================= */

.hero-text{

    position:relative;
    z-index:2;

    margin-top:27px;

    text-align:center;

    font-size:21px;
    line-height:1.35;

    font-weight:700;

    color:#ffffff;
}

.hero-text span{
    color:#ffe82e;
}


/* =========================
   CHARACTER IMAGE
========================= */

.login-character{

    position:relative;
    z-index:2;

    margin-top:5px;

    flex:1;

    width:min(78vw,390px);

    display:flex;
    align-items:flex-end;
    justify-content:center;

    opacity:1;

    transition:
        opacity .2s ease,
        transform .3s ease;
}

.login-character img{

    width:100%;

    max-height:430px;

    display:block;

    object-fit:contain;
    object-position:center bottom;
}


/* =========================
   LOGIN OPEN

   IMAGE HIDE
========================= */

.login-page.login-open .login-character{
    opacity:0;
    transform:translateY(-15px);
    pointer-events:none;

    position:absolute;
    visibility:hidden;
}


/* Hero still shows:
   CEZOO +
   Groceries delivered in minutes
*/

.login-page.login-open .login-hero{
    flex:0 0 auto;
    min-height:310px;
}


/* =========================
   BOTTOM WHITE AREA
========================= */

.login-bottom{

    position:relative;
    z-index:10;

    background:#ffffff;

    border-radius:30px 30px 0 0;

    padding:
        28px
        24px
        calc(28px + env(safe-area-inset-bottom));

    text-align:center;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.045);

    transition:
        min-height .35s ease,
        padding .35s ease;
}


/* =========================
   WHEN LOGIN OPENS
========================= */

.login-page.login-open .login-bottom{

    flex:1;

    min-height:calc(100dvh - 310px);

    padding-top:32px;

    text-align:left;
}


/* =========================
   FIRST SCREEN
========================= */

.first-login-content{
    display:block;
}


/* LOGIN OPEN AYYAKA
   BUTTON + TERMS + LINE HIDE */

.login-page.login-open .first-login-content{
    display:none;
}


/* =========================
   LOGIN BUTTON
========================= */

.phone-login-btn{

    width:100%;
    height:60px;

    border:0;

    border-radius:30px;

    background:#078d39;

    color:#ffffff;

    font-size:17px;
    font-weight:600;

    cursor:pointer;
}

.phone-login-btn:active{
    transform:scale(.985);
}


/* =========================
   LIGHT DASHED LINE
========================= */

.terms-line{

    width:100%;

    margin:25px 0 18px;

    border-top:
        1px dashed
        rgba(100,100,100,.28);
}


/* =========================
   TERMS
========================= */

.terms{

    color:#999;

    font-size:11.5px;

    line-height:1.65;

    text-align:center;
}

.terms a{

    color:#777;

    font-weight:600;

    text-decoration:underline;
}


/* =========================
   LOGIN FORM
========================= */

.login-form{
    display:none;
}

.login-page.login-open .login-form{
    display:block;
}


/* =========================
   STEPS
========================= */

.login-step{
    display:none;
}

.login-step.active{
    display:block;

    animation:stepIn .25s ease;
}

@keyframes stepIn{

    from{
        opacity:0;
        transform:translateX(10px);
    }

    to{
        opacity:1;
        transform:translateX(0);
    }

}


/* =========================
   FORM TITLE
========================= */

.form-title{

    color:#171717;

    font-size:23px;
    line-height:1.3;

    font-weight:700;
}

.form-subtitle{

    margin-top:7px;

    color:#8c8c8c;

    font-size:13px;
    line-height:1.5;
}


/* =========================
   INPUT BOX
========================= */

.input-box{

    width:100%;
    height:60px;

    margin-top:24px;

    display:flex;
    align-items:center;

    background:#ffffff;

    border:1.5px solid #dedede;

    border-radius:15px;

    overflow:hidden;

    transition:.2s ease;
}

.input-box:focus-within{

    border-color:#078d39;

    box-shadow:
        0 0 0 3px rgba(7,141,57,.07);
}


.mobile-prefix{

    height:26px;

    padding:0 14px 0 17px;

    display:flex;
    align-items:center;

    border-right:1px solid #dedede;

    color:#222;

    font-size:15px;
    font-weight:600;

    flex-shrink:0;
}


.input-box input{

    width:100%;
    height:100%;

    border:0;
    outline:0;

    padding:0 14px;

    background:transparent;

    color:#171717;

    font-size:16px;
    font-weight:500;
}

.input-box input::placeholder{
    color:#aaa;
}


/* =========================
   NEXT BUTTON
========================= */

.next-btn{

    width:100%;
    height:58px;

    margin-top:15px;

    border:0;

    border-radius:15px;

    background:#078d39;

    color:#ffffff;

    font-size:16px;
    font-weight:600;

    cursor:pointer;
}

.next-btn:active{
    transform:scale(.985);
}


/* =========================
   OTP
========================= */

.otp-boxes{

    width:100%;

    margin-top:24px;

    display:flex;

    gap:8px;
}

.otp-boxes input{

    width:100%;
    min-width:0;

    height:56px;

    border:1.5px solid #dedede;
    outline:0;

    border-radius:12px;

    background:#ffffff;

    text-align:center;

    color:#171717;

    font-size:20px;
    font-weight:700;
}

.otp-boxes input:focus{

    border-color:#078d39;

    box-shadow:
        0 0 0 3px rgba(7,141,57,.07);
}


.otp-number{
    color:#078d39;
    font-weight:600;
}


/* =========================
   RESEND
========================= */

.resend-btn{

    display:block;

    margin:18px auto 0;

    border:0;
    background:transparent;

    color:#078d39;

    font-size:13px;
    font-weight:600;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .cezoo-logo{
        font-size:44px;
        margin-top:50px;
    }

    .hero-text{
        font-size:19px;
        margin-top:24px;
    }

    .login-character{
        width:77vw;
        margin-top:4px;
    }

    .login-character img{
        max-height:390px;
    }

    .login-bottom{

        border-radius:27px 27px 0 0;

        padding-left:22px;
        padding-right:22px;
    }

    .login-page.login-open .login-hero{
        min-height:280px;
    }

    .login-page.login-open .login-bottom{
        min-height:calc(100dvh - 280px);
    }

    .form-title{
        font-size:21px;
    }

}

</style>
</head>


<body>

<div
    class="login-page"
    id="loginPage"
>


    <!-- ======================
         GREEN SECTION
    ======================= -->

    <section class="login-hero">


        <!-- BACK -->

        <button
            class="back-btn"
            onclick="loginBack()"
            aria-label="Back"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <!-- CEZOO -->

        <div class="cezoo-logo">
            CEZOO
        </div>


        <!-- TEXT -->

        <div class="hero-text">

            Groceries delivered<br>

            <span>
                in minutes
            </span>

        </div>


        <!-- YOUR IMAGE -->

        <div class="login-character">

            <img
                src="god.webp"
                alt="CEZOO"
            >

        </div>


    </section>



    <!-- ======================
         WHITE SECTION
    ======================= -->

    <section class="login-bottom">


        <!-- =====================
             FIRST SCREEN
        ====================== -->

        <div class="first-login-content">


            <button
                class="phone-login-btn"
                onclick="openMobileLogin()"
            >

                Log in with phone number

            </button>


            <div class="terms-line"></div>


            <div class="terms">

                By tapping, I accept the

                <a href="#">
                    terms of service
                </a>

                &amp;

                <a href="#">
                    privacy policy
                </a>

            </div>


        </div>



        <!-- =====================
             LOGIN FORM
        ====================== -->

        <div class="login-form">


            <!-- MOBILE STEP -->

            <div
                class="login-step active"
                id="mobileStep"
            >


                <div class="form-title">
                    Enter your mobile number
                </div>


                <div class="form-subtitle">
                    We'll send an OTP to verify your number
                </div>


                <div class="input-box">


                    <div class="mobile-prefix">
                        +91
                    </div>


                    <input
                        type="tel"
                        id="mobileInput"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                    >


                </div>


                <button
                    class="next-btn"
                    onclick="openOtp()"
                >
                    Next
                </button>


            </div>



            <!-- OTP STEP -->

            <div
                class="login-step"
                id="otpStep"
            >


                <div class="form-title">
                    Enter OTP
                </div>


                <div class="form-subtitle">

                    OTP sent to

                    <span
                        class="otp-number"
                        id="otpNumber"
                    ></span>

                </div>


                <div class="otp-boxes">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                    <input type="tel" maxlength="1" inputmode="numeric">

                </div>


                <button
                    class="next-btn"
                    onclick="verifyOtp()"
                >
                    Verify & Continue
                </button>


                <button
                    class="resend-btn"
                    type="button"
                >
                    Resend OTP
                </button>


            </div>


        </div>


    </section>


</div>


<script>

const loginPage =
    document.getElementById("loginPage");

const mobileStep =
    document.getElementById("mobileStep");

const otpStep =
    document.getElementById("otpStep");

const mobileInput =
    document.getElementById("mobileInput");

const otpNumber =
    document.getElementById("otpNumber");

let currentStep = "home";


/* =========================
   OPEN MOBILE LOGIN
========================= */

function openMobileLogin(){

    currentStep = "mobile";

    loginPage.classList.add(
        "login-open"
    );

    mobileStep.classList.add(
        "active"
    );

    otpStep.classList.remove(
        "active"
    );


    /*
       IMPORTANT:
       focus immediately from click.
       Mobile/WebView lo keyboard
       open avvadaniki useful.
    */

    mobileInput.focus();


    setTimeout(() => {

        mobileInput.focus();

    },250);

}


/* =========================
   ONLY NUMBERS
========================= */

mobileInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,10);

    }
);


/* =========================
   MOBILE → OTP
========================= */

function openOtp(){

    const mobile =
        mobileInput.value
            .replace(/\D/g,"");


    if(mobile.length !== 10){

        alert(
            "Please enter a valid 10 digit mobile number"
        );

        mobileInput.focus();

        return;
    }


    otpNumber.textContent =
        "+91 " + mobile;


    currentStep = "otp";


    mobileStep.classList.remove(
        "active"
    );

    otpStep.classList.add(
        "active"
    );


    setTimeout(() => {

        otpInputs[0].focus();

    },100);

}


/* =========================
   OTP INPUTS
========================= */

const otpInputs =
    Array.from(
        document.querySelectorAll(
            ".otp-boxes input"
        )
    );


otpInputs.forEach(
    (input,index) => {


        input.addEventListener(
            "input",
            function(){

                this.value =
                    this.value
                        .replace(/\D/g,"")
                        .slice(0,1);


                if(
                    this.value &&
                    index < otpInputs.length - 1
                ){

                    otpInputs[
                        index + 1
                    ].focus();

                }

            }
        );


        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Backspace" &&
                    !this.value &&
                    index > 0
                ){

                    otpInputs[
                        index - 1
                    ].focus();

                }

            }
        );

    }
);


/* =========================
   VERIFY DEMO
========================= */

function verifyOtp(){

    const otp =
        otpInputs
            .map(input => input.value)
            .join("");


    if(otp.length !== 6){

        alert(
            "Please enter complete OTP"
        );

        return;
    }


    /*
       UI DEMO ONLY.
       Existing OTP verification
       later ikkada connect cheddam.
    */

    alert("OTP completed");

}


/* =========================
   BACK
========================= */

function loginBack(){


    /* OTP → MOBILE */

    if(currentStep === "otp"){

        currentStep = "mobile";

        otpStep.classList.remove(
            "active"
        );

        mobileStep.classList.add(
            "active"
        );


        setTimeout(() => {

            mobileInput.focus();

        },100);

        return;
    }


    /* MOBILE → FIRST SCREEN */

    if(currentStep === "mobile"){

        currentStep = "home";

        loginPage.classList.remove(
            "login-open"
        );

        mobileStep.classList.add(
            "active"
        );

        otpStep.classList.remove(
            "active"
        );

        mobileInput.blur();

        return;
    }


    /* FIRST SCREEN → PAGE BACK */

    if(window.history.length > 1){

        history.back();

    }

}

</script>

</body>
</html>
